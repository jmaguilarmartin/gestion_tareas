<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema de Actividades</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 450px;
      width: 100%;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h1 {
      color: #4285f4;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .login-header p {
      color: #666;
      font-size: 1rem;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .user-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 8px;
    }

    .user-card {
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-card:hover {
      border-color: #4285f4;
      box-shadow: 0 4px 12px rgba(66, 133, 244, 0.2);
      transform: translateY(-2px);
    }

    .user-card.selected {
      border-color: #4285f4;
      background: #e8f0fe;
    }

    .user-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.4rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .user-info {
      flex: 1;
    }

    .user-name {
      font-weight: 600;
      color: #333;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .user-email {
      color: #666;
      font-size: 0.9rem;
    }

    .user-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
      background: #e8f5e9;
      color: #2e7d32;
      font-weight: 500;
    }

    .login-button {
      background: #4285f4;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .login-button:hover:not(:disabled) {
      background: #357ae8;
      box-shadow: 0 4px 12px rgba(66, 133, 244, 0.4);
    }

    .login-button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .loading {
      text-align: center;
      padding: 40px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #4285f4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      background: #ffebee;
      color: #c62828;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
    }

    .remember-container {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .remember-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .remember-text {
      flex: 1;
    }

    .remember-title {
      font-weight: 600;
      color: #333;
    }

    .remember-desc {
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h1>📅 Sistema de Actividades</h1>
        <p>JMA Consultores</p>
      </div>

      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Cargando usuarios...</p>
      </div>

      <div id="error-container"></div>

      <div id="login-content" style="display: none;">
        <div class="login-form">
          <p style="color: #666; text-align: center; margin-bottom: 10px;">
            Selecciona tu usuario para acceder
          </p>

          <div id="users-grid" class="user-grid"></div>

          <div class="remember-container">
            <label class="remember-label">
              <input type="checkbox" id="remember-me" checked>
              <div class="remember-text">
                <div class="remember-title">Mantener sesión iniciada</div>
                <div class="remember-desc">
                  Tu sesión permanecerá activa incluso después de cerrar el navegador
                </div>
              </div>
            </label>
          </div>

          <button id="btn-login" class="login-button" disabled>
            Acceder al Sistema
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/.netlify/functions';
    let personas = [];
    let usuarioSeleccionado = null;

    console.log('🔍 login.html cargado');

    function verificarSesionExistente() {
      console.log('🔍 Verificando sesión existente...');
      
      const usuarioLocal = localStorage.getItem('usuario_actual');
      const usuarioSession = sessionStorage.getItem('usuario_actual');
      
      const urlParams = new URLSearchParams(window.location.search);
      const esLogout = urlParams.get('logout') === 'true';
      
      if (esLogout) {
        console.log('🚪 Logout detectado - limpiando sesiones');
        localStorage.removeItem('usuario_actual');
        sessionStorage.removeItem('usuario_actual');
        window.history.replaceState({}, document.title, 'login.html');
        return false;
      }
      
      if (usuarioLocal || usuarioSession) {
        console.log('✅ Sesión detectada - redirigiendo a index.html');
        window.location.href = 'index.html';
        return true;
      }
      
      console.log('ℹ️ No hay sesión - mostrando pantalla de login');
      return false;
    }

    const hayaSesion = verificarSesionExistente();

    if (!hayaSesion) {
      console.log('📋 Iniciando carga de personas...');
      cargarPersonas();
    }

    async function cargarPersonas() {
      const loadingEl = document.getElementById('loading');
      const loginContentEl = document.getElementById('login-content');
      
      try {
        console.log('📋 cargarPersonas() ejecutándose...');
        console.log('🌐 Haciendo fetch a:', `${API_BASE}/personas-listar`);
        
        const response = await fetch(`${API_BASE}/personas-listar`);
        console.log('📥 Respuesta recibida. Status:', response.status);
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        console.log('📊 Datos parseados:', data);

        if (!data.success) {
          throw new Error(data.error || 'Error desconocido');
        }

        personas = data.data.filter(p => p.activo);
        console.log(`✅ Personas activas cargadas: ${personas.length}`);

        if (personas.length === 0) {
          mostrarError('No hay usuarios activos. Contacta al administrador.');
          return;
        }

        renderizarUsuarios();

      } catch (error) {
        console.error('❌ Error cargando personas:', error);
        mostrarError('Error al cargar usuarios: ' + error.message);
      } finally {
        if (loadingEl) loadingEl.style.display = 'none';
        if (loginContentEl) loginContentEl.style.display = 'block';
      }
    }

    function renderizarUsuarios() {
      const grid = document.getElementById('users-grid');
      if (!grid) return;
      
      grid.innerHTML = '';

      personas.forEach(persona => {
        const iniciales = persona.nombre
          .split(' ')
          .map(n => n[0])
          .join('')
          .toUpperCase()
          .substring(0, 2);

        const card = document.createElement('div');
        card.className = 'user-card';
        card.innerHTML = `
          <div class="user-avatar">${iniciales}</div>
          <div class="user-info">
            <div class="user-name">${persona.nombre}</div>
            <div class="user-email">${persona.email}</div>
          </div>
          ${persona.cargo ? `<span class="user-badge">${persona.cargo}</span>` : ''}
        `;

        card.addEventListener('click', () => seleccionarUsuario(persona, card));
        grid.appendChild(card);
      });
    }

    function seleccionarUsuario(persona, card) {
      document.querySelectorAll('.user-card').forEach(c => {
        c.classList.remove('selected');
      });

      card.classList.add('selected');
      usuarioSeleccionado = persona;

      const btnLogin = document.getElementById('btn-login');
      if (btnLogin) btnLogin.disabled = false;
    }

    function mostrarError(mensaje) {
      const container = document.getElementById('error-container');
      if (container) {
        container.innerHTML = `
          <div class="error-message">
            ${mensaje}
            <br><br>
            <button onclick="location.reload()" class="btn btn-primary">
              🔄 Reintentar
            </button>
          </div>
        `;
      }
    }

    const btnLogin = document.getElementById('btn-login');
    if (btnLogin) {
      btnLogin.addEventListener('click', () => {
        if (!usuarioSeleccionado) return;

        const recordarCheckbox = document.getElementById('remember-me');
        const recordar = recordarCheckbox ? recordarCheckbox.checked : true;

        const datosUsuario = {
          email: usuarioSeleccionado.email,
          nombre: usuarioSeleccionado.nombre,
          cargo: usuarioSeleccionado.cargo || '',
          departamento: usuarioSeleccionado.departamento || '',
          loginTime: new Date().toISOString(),
          lastActivity: new Date().toISOString(),
          recordarme: recordar
        };

        if (recordar) {
          localStorage.setItem('usuario_actual', JSON.stringify(datosUsuario));
          sessionStorage.removeItem('usuario_actual');
          console.log('✅ Sesión guardada en localStorage');
        } else {
          sessionStorage.setItem('usuario_actual', JSON.stringify(datosUsuario));
          localStorage.removeItem('usuario_actual');
          console.log('✅ Sesión guardada en sessionStorage');
        }

        window.location.href = 'index.html';
      });
    }
  </script>
</body>
</html>
